
name: Solana Sidekick Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: solana-sidekick-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore previous scan history
        uses: actions/cache/restore@v4
        with:
          path: seen.json
          key: sidekick-seen-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sidekick-seen-

      - name: Run market scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Save scan history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen.json
          key: sidekick-seen-${{ github.run_id }}-${{ github.run_attempt }}
